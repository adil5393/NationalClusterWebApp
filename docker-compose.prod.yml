services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Runtime-uploaded content (participant/gallery photos) is written under
    # /app/assets at runtime — without this bind mount it lives only in the
    # container's writable layer and is silently wiped on the next
    # `up --build`/recreate. Bind-mounting (not a named volume) keeps it
    # visible/backupable directly from the host at ./backend/assets.
    volumes:
      - ./backend/assets:/app/assets
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      TEAM_DETAILS_SHEET_URL: ${TEAM_DETAILS_SHEET_URL:-}
      # Flip to true once HTTPS (certbot/letsencrypt, below) is actually issued and
      # serving — a secure cookie silently never gets set over plain HTTP.
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      - backend
    ports:
        - "127.0.0.1:8081:80"
volumes:
  pgdata: