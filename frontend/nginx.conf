server {
    listen 80;
    server_name kabaddinationalscluster.info www.kabaddinationalscluster.info;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kabaddinationalscluster.info www.kabaddinationalscluster.info;

    ssl_certificate /etc/letsencrypt/live/kabaddinationalscluster.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kabaddinationalscluster.info/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8001/health;
        proxy_set_header Host $host;
    }

    # Live match score/status feed (see backend/app/routers/live_ws.py) — needs
    # the Upgrade/Connection headers that /api/ above doesn't send.
    location /ws/ {
        proxy_pass http://backend:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}